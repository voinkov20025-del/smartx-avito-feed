name: Verify Railway Avito full XML downloads
on:
  push:
    paths: ['.github/workflows/check-railway-ihub-xml.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download both Railway URLs and verify byte-for-byte XML identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request,time,os,xml.etree.ElementTree as ET
          base='https://ihub-xml-gateway-production.up.railway.app'
          files=[
          ('/ihub-1.xml','ihub/feeds/ihub-final-part-1-00001-20000.xml'),
          ('/ihub-2.xml','ihub/feeds/ihub-final-part-2-20001-40000.xml')]
          for route,original in files:
            t=time.monotonic()
            req=urllib.request.Request(base+route,headers={'User-Agent':'iHub-Avito-XML-Verify/1.0','Accept':'application/xml'})
            h=hashlib.sha256();n=0;start=None
            with urllib.request.urlopen(req,timeout=180) as r:
              assert r.status==200,(route,r.status)
              assert 'xml' in r.headers.get('content-type','').lower(),(route,r.headers)
              while True:
                chunk=r.read(1024*1024)
                if not chunk:break
                if start is None:start=chunk[:70]
                n+=len(chunk);h.update(chunk)
              print('HTTP',r.status,route,'content-type',r.headers.get('Content-Type'),'bytes',n,'seconds',round(time.monotonic()-t,2),'first',start,flush=True)
            b=hashlib.file_digest(open(original,'rb'),'sha256').hexdigest()
            assert h.hexdigest()==b,(route,h.hexdigest(),b)
            print('PASS byte-for-byte SHA256 matches original',route,flush=True)
          print('BOTH RAILWAY XML LINKS VERIFIED',flush=True)
          PY