name: Extend iHub with iPhone 15 Pro and Pro Max

on:
  push:
    paths:
      - 'ihub/extension/RUN_20261102'
      - '.github/workflows/ihub-15pro-extension.yml'

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build 24 new SKU across 580 cities
        shell: bash
        run: |
          set -euo pipefail
          python3 ihub/extension/build_15pro_extension.py

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          test -s ihub/feeds/iHub_STRUCTURE_13920_URL_FINAL_PART_3_40021-53940.xml
          test "$(find ihub/images/2026-11-02 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 24
          grep -q 'STATUS: PASS' ihub/extension/iHub_15PRO_EXTENSION_VALIDATION.txt
          grep -q 'New ads: 13920' ihub/extension/iHub_15PRO_EXTENSION_VALIDATION.txt
          grep -q 'Total ads after extension: 53940' ihub/extension/iHub_15PRO_EXTENSION_VALIDATION.txt
          grep -q 'Total SKU: 93' ihub/extension/iHub_15PRO_EXTENSION_VALIDATION.txt
          grep -q 'Images per new ad: exactly 6' ihub/extension/iHub_15PRO_EXTENSION_VALIDATION.txt

      - name: Publish part 3 and approved covers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iHub feed publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add ihub/feeds/iHub_STRUCTURE_13920_URL_FINAL_PART_3_40021-53940.xml ihub/images/2026-11-02 ihub/extension/iHub_15PRO_SKU_MATRIX.json ihub/extension/iHub_15PRO_EXTENSION_VALIDATION.txt
          if git diff --cached --quiet; then
            echo 'Published extension files already match main; nothing to commit.'
          else
            git commit -m 'Add iHub iPhone 15 Pro and Pro Max SKU extension'
            git push origin main
          fi

      - name: Confirm public HTTPS availability
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          python3 - <<'PY'
          import json, urllib.request, time
          from pathlib import Path
          matrix=json.loads(Path('ihub/extension/iHub_15PRO_SKU_MATRIX.json').read_text(encoding='utf-8'))
          urls=['https://raw.githubusercontent.com/voinkov20025-del/smartx-avito-feed/main/ihub/images/2026-11-02/'+x['cover'] for x in matrix]
          urls.append('https://raw.githubusercontent.com/voinkov20025-del/smartx-avito-feed/main/ihub/feeds/iHub_STRUCTURE_13920_URL_FINAL_PART_3_40021-53940.xml')
          errors=[]
          for url in urls:
              ok=False; last=''
              for _ in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'iHub-extension-check/1.0','Range':'bytes=0-255'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          head=r.read(256)
                          if r.status in (200,206):
                              if url.endswith('.jpg') and head[:2]==b'\xff\xd8': ok=True
                              elif url.endswith('.xml') and b'<Ads' in head: ok=True
                          if ok: break
                          last=f'status={r.status}'
                  except Exception as e:
                      last=repr(e)
                  time.sleep(2)
              if not ok: errors.append((url,last))
          if errors: raise SystemExit('PUBLIC CHECK FAILED: '+repr(errors[:5]))
          print('PUBLIC CHECK PASS: 24 covers + PART 3 XML')
          PY

      - name: Save extension checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat > ihub/extension/CHECKPOINT_15PRO_COMPLETE.txt <<'EOF'
          CHECKPOINT: 15PRO_EXTENSION_PUBLICATION_CONFIRMED
          Added 24 SKU: iPhone 15 Pro 128/256/512 and iPhone 15 Pro Max 256/512/1TB, four colors each.
          Added 13,920 ads across the same 580 iHub addresses.
          Existing PART 1 and PART 2 were not modified.
          PART 3 contains only the new 13,920 ads.
          Each new ad has exactly 6 images: one approved model/color cover plus the existing five iHub universal cards.
          GitHub Actions verified all 24 new cover URLs and the PART 3 XML URL publicly over HTTPS.
          Final iHub matrix: 93 SKU, 53,940 ads.
          EOF
          git add ihub/extension/CHECKPOINT_15PRO_COMPLETE.txt
          if git diff --cached --quiet; then
            echo 'Publication checkpoint already matches main; nothing to commit.'
          else
            git commit -m 'Confirm iHub 15 Pro extension publication'
            git push origin main
          fi
