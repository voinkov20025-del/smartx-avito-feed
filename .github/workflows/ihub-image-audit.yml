name: Audit iHub image and XML links
on:
  workflow_dispatch:
  push:
    paths:
      - 'ihub/diagnostics/RUN_AUDIT'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check pillow
      - name: Read-only audit of existing image and feed files
        run: python3 ihub/diagnostics/audit_images.py
      - name: Save diagnostic checkpoint
        run: |
          git config user.name "iHub diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add ihub/diagnostics/PHOTO_AUDIT_RESULT.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record iHub public image and feed diagnostic"
            git push origin main
          fi
