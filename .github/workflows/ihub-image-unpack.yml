name: iHub image bundle unpack
on:
  push:
    branches: [ main ]
    paths:
      - '.ihub_upload/READY'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild image bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ihub/images/2026-10-04
          cat .ihub_upload/part-*.txt | base64 --decode > /tmp/ihub-images.zip
          unzip -o /tmp/ihub-images.zip -d ihub/images/2026-10-04
          test "$(find ihub/images/2026-10-04 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 74
      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ihub/images/2026-10-04
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add iHub 74 Avito images"
            git push
          fi
