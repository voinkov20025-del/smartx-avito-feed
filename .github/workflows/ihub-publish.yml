name: Verify published iHub Avito feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate published files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ihub/images/2026-10-05 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 74
          test -s ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_1_00001-20010.xml
          test -s ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_2_20011-40020.xml
          grep -q 'STATUS: PASS' ihub/iHub_URL_FEED_FINAL_VALIDATION.txt
          grep -q 'Total ads: 40020' ihub/iHub_URL_FEED_FINAL_VALIDATION.txt
          grep -q 'Images per ad: exactly 6' ihub/iHub_URL_FEED_FINAL_VALIDATION.txt
          grep -q 'Unique image URLs: 74' ihub/iHub_URL_FEED_FINAL_VALIDATION.txt
          grep -q 'Non-Images fields: byte-identical after Images normalization' ihub/iHub_URL_FEED_FINAL_VALIDATION.txt
      - name: Confirm public HTTPS availability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, time
          from pathlib import Path
          manifest=json.loads(Path('ihub/iHub_PUBLIC_PHOTO_URLS.json').read_text(encoding='utf-8'))
          assert len(manifest)==74
          errors=[]
          for item in manifest:
              url=item['url']; ok=False; last=''
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'iHub-Avito-feed-check/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          ctype=(r.headers.get('Content-Type') or '').lower(); head=r.read(64)
                          if r.status==200 and ('image/jpeg' in ctype or head[:2]==b'\xff\xd8'):
                              ok=True; break
                          last=f'status={r.status} content-type={ctype}'
                  except Exception as e: last=repr(e)
                  time.sleep(2)
              if not ok: errors.append((url,last))
          feeds=[
            'https://raw.githubusercontent.com/voinkov20025-del/smartx-avito-feed/main/ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_1_00001-20010.xml',
            'https://raw.githubusercontent.com/voinkov20025-del/smartx-avito-feed/main/ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_2_20011-40020.xml',
          ]
          for url in feeds:
              ok=False; last=''
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'iHub-Avito-feed-check/1.0','Range':'bytes=0-255'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          head=r.read(256)
                          if r.status in (200,206) and b'<Ads' in head:
                              ok=True; break
                          last=f'status={r.status}'
                  except Exception as e: last=repr(e)
                  time.sleep(2)
              if not ok: errors.append((url,last))
          if errors: raise SystemExit('PUBLIC URL CHECK FAILED: '+repr(errors[:5]))
          print('PUBLIC URL CHECK PASS: 74 images + 2 XML feeds')
          PY
