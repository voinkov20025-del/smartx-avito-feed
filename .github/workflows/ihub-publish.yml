name: Publish iHub Avito URL feeds

on:
  push:
    paths:
      - 'ihub/publisher/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate 74 public images and two URL feeds
        run: |
          set -euo pipefail
          python3 ihub/publisher/generate_url_feed.py \
            --config ihub/publisher/ihub_publisher_config.zlib.b64 \
            --out .

      - name: Verify generated file sizes
        run: |
          set -euo pipefail
          test "$(find ihub/images/2026-10-05 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 74
          test -s ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_1_00001-20010.xml
          test -s ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_2_20011-40020.xml
          test "$(stat -c%s ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_1_00001-20010.xml)" -lt 104857600
          test "$(stat -c%s ihub/feeds/iHub_STRUCTURE_40020_URL_FINAL_PART_2_20011-40020.xml)" -lt 104857600
          grep -q 'STATUS: PASS' ihub/iHub_URL_FEED_FINAL_VALIDATION.txt

      - name: Commit published assets
        run: |
          set -euo pipefail
          git config user.name 'iHub feed publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add ihub/images/2026-10-05 ihub/feeds ihub/iHub_PUBLIC_PHOTO_URLS.json ihub/iHub_URL_FEED_FINAL_VALIDATION.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Publish iHub Avito URL feeds and 74 public images'
          git push origin main
