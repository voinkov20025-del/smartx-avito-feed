name: Publish SmartX feeds

on:
  push:
    branches: [main]
    paths:
      - "bundles/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore SmartX package
        shell: bash
        run: |
          set -euo pipefail
          cat bundles/smartx-min2.b64.part-* > /tmp/smartx-min2.b64
          echo "8002409c94c62587968a50b601a02e96fe5791dfef1d32c958274e416d3837d9  /tmp/smartx-min2.b64" | sha256sum -c -
          base64 -d /tmp/smartx-min2.b64 > /tmp/smartx-min2.tar.xz
          echo "23b76cdc8ff17d314bc465a1dee278f4edbf0758f2e7a5f6191c15e73032291f  /tmp/smartx-min2.tar.xz" | sha256sum -c -
          rm -rf /tmp/smartx-autopublish
          mkdir -p /tmp/smartx-autopublish
          tar -xJf /tmp/smartx-min2.tar.xz -C /tmp/smartx-autopublish
          xz -d /tmp/smartx-autopublish/feeds/smartx-final-part-1-00001-20000.xml.xz
          xz -d /tmp/smartx-autopublish/feeds/smartx-final-part-2-20001-40000.xml.xz

      - name: Rebuild approved SmartX photos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow pillow-avif-plugin
          rm -rf photos/smartx
          mkdir -p photos/smartx
          python - <<'PY'
          import json
          from pathlib import Path
          import pillow_avif  # noqa: F401
          from PIL import Image

          src = Path('/tmp/smartx-autopublish')
          atlas = Image.open(src / 'photos-atlas.avif').convert('RGB')
          manifest = json.loads((src / 'atlas_manifest.json').read_text(encoding='utf-8'))
          out = Path('photos/smartx')
          out.mkdir(parents=True, exist_ok=True)

          for item in manifest['items']:
              x, y, w, h = (item['x'], item['y'], item['w'], item['h'])
              crop = atlas.crop((x, y, x + w, y + h)).convert('RGB')
              scale = max(1.0, 1200 / max(crop.size))
              if scale > 1.0:
                  new_size = (round(crop.width * scale), round(crop.height * scale))
                  crop = crop.resize(new_size, Image.Resampling.LANCZOS)
              crop.save(out / item['file'], 'JPEG', quality=92, optimize=True, progressive=True)
          print('rebuilt', len(manifest['items']), 'photos')
          PY

      - name: Install final XML feeds
        shell: bash
        run: |
          set -euo pipefail
          rm -f feeds/smartx-final-part-*.xml
          cp /tmp/smartx-autopublish/feeds/smartx-final-part-1-00001-20000.xml feeds/
          cp /tmp/smartx-autopublish/feeds/smartx-final-part-2-20001-40000.xml feeds/

      - name: Validate SmartX package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          feeds = [
              Path('feeds/smartx-final-part-1-00001-20000.xml'),
              Path('feeds/smartx-final-part-2-20001-40000.xml'),
          ]
          expected_prefix = 'https://raw.githubusercontent.com/voinkov20025-del/smartx-avito-feed/main/photos/smartx/'
          all_ids = []
          total_ads = 0
          for path in feeds:
              text = path.read_text(encoding='utf-8')
              ads = re.findall(r'<Ad\b[\s\S]*?</Ad>', text)
              assert len(ads) == 20000, (path, len(ads))
              total_ads += len(ads)
              for ad in ads:
                  m = re.search(r'<Id>(.*?)</Id>', ad, re.S)
                  assert m, 'Missing Id'
                  all_ids.append(m.group(1).strip())
                  urls = re.findall(r'<Image\s+url="([^"]+)"\s*/?>', ad)
                  assert len(urls) == 6, (m.group(1), len(urls))
                  assert all(u.startswith(expected_prefix) for u in urls), m.group(1)

          assert total_ads == 40000, total_ads
          assert len(set(all_ids)) == 40000, (len(all_ids), len(set(all_ids)))

          photos = sorted(Path('photos/smartx').glob('*.jpg'))
          assert len(photos) == 104, len(photos)
          for p in photos:
              with Image.open(p) as im:
                  assert max(im.size) >= 1200, (p.name, im.size)
                  assert min(im.size) >= 600, (p.name, im.size)

          referenced = set()
          for path in feeds:
              text = path.read_text(encoding='utf-8')
              referenced.update(re.findall(r'photos/smartx/([^"<]+\.jpg)', text))
          actual = {p.name for p in photos}
          assert referenced == actual, (len(referenced), len(actual), referenced - actual, actual - referenced)
          print('VALIDATION OK: 40000 ads, 40000 unique IDs, 104 photos, 6 images/ad')
          PY

      - name: Commit published SmartX feeds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundles
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds photos bundles
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git commit -m "Publish final SmartX 40000 feed [skip ci]"
          git push
