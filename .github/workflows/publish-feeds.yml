name: Publish SmartX feeds

on:
  push:
    branches: [main]
    paths:
      - "bundles/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore SmartX XML files and photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartx-bundle

          if [ -f bundles/SmartX_GitHub_PUBLISH_PAYLOAD.tar.gz ]; then
            cp bundles/SmartX_GitHub_PUBLISH_PAYLOAD.tar.gz /tmp/smartx-bundle/payload.tar.gz
          elif [ -f bundles/smartx-avito-payload.tar.gz ]; then
            cp bundles/smartx-avito-payload.tar.gz /tmp/smartx-bundle/payload.tar.gz
          else
            shopt -s nullglob
            parts=(bundles/smartx-avito-payload.tar.gz.part-*)
            if [ ${#parts[@]} -eq 0 ]; then
              echo "SmartX payload not found in bundles/"
              exit 1
            fi
            cat "${parts[@]}" > /tmp/smartx-bundle/payload.tar.gz
          fi

          tar -tzf /tmp/smartx-bundle/payload.tar.gz >/dev/null
          tar -xzf /tmp/smartx-bundle/payload.tar.gz -C .
          rm -rf bundles

      - name: Commit published feeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feeds photos bundles
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git commit -m "Publish SmartX Avito feeds and photos"
          git push
