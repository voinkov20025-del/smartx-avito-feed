name: Publish SmartX final 40000

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-smartx-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download final SmartX package from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          rm -rf /tmp/smartx-final /tmp/smartx-final.tar.gz
          mkdir -p /tmp/smartx-final
          gdown "1FTAQsgpJgsWiQBd3POEz-TJcILniiY9F" -O /tmp/smartx-final.tar.gz
          echo "Downloaded bytes: $(stat -c%s /tmp/smartx-final.tar.gz)"
          test "$(stat -c%s /tmp/smartx-final.tar.gz)" -gt 15000000
          tar -tzf /tmp/smartx-final.tar.gz >/dev/null
          tar -xzf /tmp/smartx-final.tar.gz -C /tmp/smartx-final
          test -f /tmp/smartx-final/feeds/smartx-final-part-1-00001-20000.xml
          test -f /tmp/smartx-final/feeds/smartx-final-part-2-20001-40000.xml
          test -d /tmp/smartx-final/photos/smartx

      - name: Normalize photo filenames and XML URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/smartx-final')
          photos = root / 'photos' / 'smartx'
          feeds = [
              root / 'feeds' / 'smartx-final-part-1-00001-20000.xml',
              root / 'feeds' / 'smartx-final-part-2-20001-40000.xml',
          ]

          mapping = {
              'smartx-034-iphone13pro-128-голубой.jpg': 'smartx-034-iphone13pro-128-blue.jpg',
              'smartx-039-iphone13pro-256-голубой.jpg': 'smartx-039-iphone13pro-256-blue.jpg',
              'smartx-049-iphone14-256-голубой.jpg': 'smartx-049-iphone14-256-blue.jpg',
              'smartx-064-iphone15-128-голубой.jpg': 'smartx-064-iphone15-128-blue.jpg',
              'smartx-068-iphone15-256-голубой.jpg': 'smartx-068-iphone15-256-blue.jpg',
          }

          for old, new in mapping.items():
              src = photos / old
              dst = photos / new
              if src.exists():
                  src.rename(dst)
              elif not dst.exists():
                  raise FileNotFoundError(old)

          for feed in feeds:
              text = feed.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new)
              feed.write_text(text, encoding='utf-8')

          non_ascii = [p.name for p in photos.glob('*.jpg') if not p.name.isascii()]
          assert not non_ascii, non_ascii
          print('Normalized photo filenames to ASCII')
          PY

      - name: Install final SmartX files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf photos/smartx
          mkdir -p photos/smartx feeds
          cp -a /tmp/smartx-final/photos/smartx/. photos/smartx/
          cp /tmp/smartx-final/feeds/smartx-final-part-1-00001-20000.xml feeds/
          cp /tmp/smartx-final/feeds/smartx-final-part-2-20001-40000.xml feeds/

      - name: Validate final SmartX feed
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          feeds = [
              Path('feeds/smartx-final-part-1-00001-20000.xml'),
              Path('feeds/smartx-final-part-2-20001-40000.xml'),
          ]
          prefix = 'https://raw.githubusercontent.com/voinkov20025-del/smartx-avito-feed/main/photos/smartx/'
          all_ids = []
          referenced = set()
          total = 0

          for feed in feeds:
              text = feed.read_text(encoding='utf-8')
              ads = re.findall(r'<Ad\\b[\\s\\S]*?</Ad>', text)
              assert len(ads) == 20000, (feed.name, len(ads))
              total += len(ads)
              for ad in ads:
                  m = re.search(r'<Id>(.*?)</Id>', ad, re.S)
                  assert m, 'Missing Id'
                  ad_id = m.group(1).strip()
                  all_ids.append(ad_id)
                  urls = re.findall(r'<Image\\s+url="([^"]+)"\\s*/?>', ad)
                  assert len(urls) == 6, (ad_id, len(urls))
                  assert all(url.startswith(prefix) for url in urls), ad_id
                  referenced.update(url.rsplit('/', 1)[-1] for url in urls)

          assert total == 40000, total
          assert len(all_ids) == 40000
          assert len(set(all_ids)) == 40000, 'IDs are not unique'

          photos = sorted(Path('photos/smartx').glob('*.jpg'))
          assert len(photos) == 104, len(photos)
          actual = {p.name for p in photos}
          assert referenced == actual, (len(referenced), len(actual), referenced - actual, actual - referenced)
          assert all(p.name.isascii() for p in photos), 'Non-ASCII photo filename remains'

          for photo in photos:
              with Image.open(photo) as im:
                  assert im.width >= 600 and im.height >= 600, (photo.name, im.size)

          print('VALIDATION OK')
          print('Ads:', total)
          print('Unique IDs:', len(set(all_ids)))
          print('Photos:', len(photos))
          print('Images per ad: 6')
          PY

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/smartx-final-part-1-00001-20000.xml \
                  feeds/smartx-final-part-2-20001-40000.xml \
                  photos/smartx
          if git diff --cached --quiet; then
            echo 'Final SmartX files already match; nothing to commit.'
            exit 0
          fi
          git commit -m "Publish final SmartX 40000 feed [skip ci]"
          git push
