name: Refresh SmartX 881 blocked IDs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-smartx-881-ids.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartx-881-id-refresh
  cancel-in-progress: true

jobs:
  refresh-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace 881 blocked IDs with new unique IDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, re

          encoded_mapping = ""
          raw = gzip.decompress(base64.b64decode(encoded_mapping)).decode('utf-8')
          pairs = [line.split('\t', 1) for line in raw.splitlines() if line.strip()]
          assert len(pairs) == 881, len(pairs)
          old_to_new = dict(pairs)
          assert len(old_to_new) == 881
          assert len(set(old_to_new.values())) == 881
          assert all(k != v for k, v in old_to_new.items())

          feeds = [
              Path('feeds/smartx-final-part-1-00001-20000.xml'),
              Path('feeds/smartx-final-part-2-20001-40000.xml'),
          ]
          ad_pat = re.compile(r'<Ad>.*?</Ad>', re.S)
          id_pat = re.compile(r'<Id>(.*?)</Id>', re.S)
          img_pat = re.compile(r'<Image url="[^"]+"')

          before_texts = {}
          all_before = []
          for feed in feeds:
              text = feed.read_text(encoding='utf-8')
              before_texts[feed] = text
              ads = ad_pat.findall(text)
              assert len(ads) == 20000, (feed.name, len(ads))
              for ad in ads:
                  m = id_pat.search(ad)
                  assert m
                  all_before.append(m.group(1).strip())
                  assert len(img_pat.findall(ad)) == 6

          assert len(all_before) == 40000
          assert len(set(all_before)) == 40000, 'IDs before replacement are not unique'
          before_set = set(all_before)
          missing_old = [x for x in old_to_new if x not in before_set]
          existing_new = [x for x in old_to_new.values() if x in before_set]
          assert not missing_old, ('Old IDs missing from current feed', missing_old[:10], len(missing_old))
          assert not existing_new, ('New IDs already exist', existing_new[:10], len(existing_new))

          replaced_total = 0
          for feed in feeds:
              before = before_texts[feed]
              before_skeleton = id_pat.sub('<Id>__ID__</Id>', before)
              counter = [0]

              def repl(m):
                  old = m.group(1).strip()
                  new = old_to_new.get(old)
                  if new is not None:
                      counter[0] += 1
                      return '<Id>' + new + '</Id>'
                  return m.group(0)

              after = id_pat.sub(repl, before)
              replaced_here = counter[0]
              replaced_total += replaced_here

              after_skeleton = id_pat.sub('<Id>__ID__</Id>', after)
              assert before_skeleton == after_skeleton, 'A non-ID field changed in ' + feed.name
              feed.write_text(after, encoding='utf-8')
              print(feed.name + ': refreshed ' + str(replaced_here) + ' IDs')

          assert replaced_total == 881, replaced_total

          all_after = []
          for feed in feeds:
              text = feed.read_text(encoding='utf-8')
              ads = ad_pat.findall(text)
              assert len(ads) == 20000
              for ad in ads:
                  m = id_pat.search(ad)
                  assert m
                  all_after.append(m.group(1).strip())
                  assert len(img_pat.findall(ad)) == 6

          assert len(all_after) == 40000
          assert len(set(all_after)) == 40000, 'IDs after replacement are not unique'
          after_set = set(all_after)
          assert not (set(old_to_new) & after_set), 'Some old blocked IDs remain'
          assert set(old_to_new.values()).issubset(after_set), 'Some new IDs are missing'

          print('VALIDATION OK')
          print('Ads:', len(all_after))
          print('Unique IDs:', len(set(all_after)))
          print('Old blocked IDs removed:', 881)
          print('New IDs added:', 881)
          print('Images per ad: 6')
          PYCODE

      - name: Commit refreshed SmartX IDs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/smartx-final-part-1-00001-20000.xml \
                  feeds/smartx-final-part-2-20001-40000.xml
          if git diff --cached --quiet; then
            echo 'No feed changes to commit.'
            exit 0
          fi
          git commit -m "Refresh 881 blocked SmartX IDs [skip ci]"
          git push
