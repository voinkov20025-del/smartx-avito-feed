name: Publish SmartX expired-only from shared Drive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smartx-expired-drive-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download prepared SmartX archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1_bjdnALGvr1X7IllPlRsL5XsYg7giDq1' -O /tmp/SmartX_expired.zip
          echo '20042fd1c7b1863ee1cc8afea8264bd368022bea5c795bc6cd996e8117114f99  /tmp/SmartX_expired.zip' | sha256sum --check
      - name: Verify and replace three existing feeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          paths=[
             ('SmartX_EXPIRED_ONLY_2026-11-26_PART_1_of_3.xml',Path('feeds/smartx-final-part-1-00001-20000.xml'),20000),
             ('SmartX_EXPIRED_ONLY_2026-11-26_PART_2_of_3.xml',Path('feeds/smartx-final-part-2-20001-40000.xml'),20000),
             ('SmartX_EXPIRED_ONLY_2026-11-26_PART_3_of_3.xml',Path('feeds/smartx-final-part-3-40001-50000.xml'),9966),
          ]
          prices={('iPhone 15','128 ГБ'):40990,('iPhone 15','256 ГБ'):43990,('iPhone 15 Pro','128 ГБ'):55990,('iPhone 15 Pro','256 ГБ'):57990,('iPhone 15 Pro','512 ГБ'):60990,('iPhone 15 Pro Max','256 ГБ'):65990,('iPhone 15 Pro Max','512 ГБ'):69990,('iPhone 15 Pro Max','1024 ГБ'):73990}
          seen=set()
          observed=set()
          contents=[]
          total=0
          with zipfile.ZipFile('/tmp/SmartX_expired.zip') as archive:
             for src,target,expected in paths:
                data=archive.read(src)
                root=ET.fromstring(data)
                assert root.tag=='Ads'
                ads=root.findall('Ad')
                assert len(ads)==expected, (src,len(ads))
                for ad in ads:
                   adid=ad.findtext('Id','')
                   assert adid.startswith('smx_renew_261126_'),adid
                   assert adid not in seen, ('duplicate ID',adid)
                   seen.add(adid)
                   sku=(ad.findtext('Model'),ad.findtext('MemorySize'))
                   if sku in prices:
                       assert int(ad.findtext('Price'))==prices[sku],(sku,adid)
                       observed.add(sku)
                   images=ad.find('Images')
                   assert images is not None and len(images.findall('Image'))==6,adid
                contents.append((target,data))
                total+=len(ads)
          assert total==49966, total
          assert len(seen)==49966,len(seen)
          assert observed==set(prices),('Missing SKUs',set(prices)-observed)
          for target,data in contents:
             target.write_bytes(data)
             print(target,len(data),'bytes')
          print('VALIDATION OK: 49966 expired ads, all fresh unique IDs, 8 price groups, 6 images each')
          PY
      - name: Publish changed XML at unchanged URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/smartx-final-part-1-00001-20000.xml feeds/smartx-final-part-2-20001-40000.xml feeds/smartx-final-part-3-40001-50000.xml
          if git diff --cached --quiet; then echo "Already published"; exit 0; fi
          git commit -m "Publish 49966 expired-only SmartX feeds from verified archive [skip ci]"
          git push
