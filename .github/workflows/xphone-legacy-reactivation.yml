name: Link and renew 1517 existing XPhone Avito ads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xphone-legacy-reactivation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link-legacy-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Add 1517 existing AvitoId values and run exhaustive XML QA
        run: python3 xphone/link_legacy_avito_ids.py
      - name: Publish existing ID linkage in both stable XML feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xphone/feed-part-1.xml xphone/feed-part-2.xml xphone/REACTIVATION_LINKAGE_REPORT.txt
          if ! git diff --cached --quiet; then
            git commit -m "Link 1517 expired legacy XPhone listings by existing AvitoId"
            git push origin HEAD:main
          fi
      - name: Final linkage report
        run: cat xphone/REACTIVATION_LINKAGE_REPORT.txt
